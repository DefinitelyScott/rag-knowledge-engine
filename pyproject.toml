[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
description = "A dependency-free hybrid-retrieval RAG engine (BM25 + TF-IDF + RRF)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ragkb = "ragkb.cli:main"

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
